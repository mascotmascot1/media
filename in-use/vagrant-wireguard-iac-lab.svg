<!-- https://github.com/DenverCoder1/readme-typing-svg/ -->
<svg xmlns='http://www.w3.org/2000/svg'
    xmlns:xlink='http://www.w3.org/1999/xlink'
    viewBox='0 0 640 80'
    style='background-color: #00000000;'
    width='640px' height='80px'>

    <style>
@font-face {
  font-family: 'Orbitron';
  font-style: normal;
  font-weight: 700;
  font-display: fallback;
  src: url(data:font/truetype;base64,) format('truetype');
}
</style>

                <path id='path0'>
                            <!-- Single line -->
                                <animate id='d0' attributeName='d' begin='0s;d0.end'
                    dur='5000ms' fill='remove'
                    values='m0,40 h0 ; m0,40 h640 ; m0,40 h640 ; m0,40 h0' keyTimes='0;0.48;0.88;1' />
                    </path>
    <text font-family='"Orbitron", monospace' fill='#F7F7F7' font-size='40'
        dominant-baseline='middle'
        x='0%' text-anchor='start'
        letter-spacing='normal'>
        <textPath xlink:href='#path0'>
            Vagrant WireGuard IaC Lab
        </textPath>
    </text>
</svg>
